# 의자 쌓기 — Cloudflare Workers 무료 플랜
# 화면(index.html)은 정적 자산, 소켓(/ws)만 Worker → Durable Object 로 간다.
# 무료 플랜은 SQLite 저장소 방식 Durable Object 만 된다(new_sqlite_classes). 저장소는 쓰지 않는다.
name = "chair-stack"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "ChairGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChairGame"]
